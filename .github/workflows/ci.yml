name: CI

on:
  push:
    branches: [claude/great-turing-ihfjsd]
  pull_request:
    branches: [claude/great-turing-ihfjsd]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      - name: Typecheck
        run: npm run typecheck
